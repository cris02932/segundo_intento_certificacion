<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nuevo Viaje</h1>

    <a href="/dashboard">Inicio</a>
    <a href="/cerrar_sesion">Cerrar sesión</a>

    {% with mensajes = get_flashed_messages(category_filter=['viaje']) %}
    {% for mensaje in mensajes %}
        <p>{{ mensaje }}</p>
    {% endfor %}
    {% endwith %}

    <form action="/crear_viaje" method="POST">
    <p>Destino:<input type="text" name="destino" required></p>
    <p>Fecha de inicio:<input type="date" name="fecha_inicio" required></p>
    <p>Fecha de fin:<input type="date" name="fecha_termino" required></p>
    <p>Itinerario:<textarea name="itinerario" rows="4" cols="50"maxlength="40" required></textarea></p>
    <button type="submit">Guardar</button>
    </form>    
</body>
</html>
